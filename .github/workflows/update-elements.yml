name: Refresh orbital elements

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Download CelesTrak elements and SatNOGS lists
        run: node scripts/fetch-catalogue-sources.mjs "$RUNNER_TEMP/catalogue"

      - name: Rebuild the catalogue
        run: node scripts/build-catalogue.mjs "$RUNNER_TEMP/catalogue"

      - name: Commit the refreshed catalogue
        id: commit
        run: |
          if git diff --quiet -- src/data/catalogue.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add src/data/catalogue.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Refresh orbital elements from CelesTrak."
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Install and build
        if: steps.commit.outputs.changed == 'true'
        run: npm ci && npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/upload-pages-artifact@v5
        if: steps.commit.outputs.changed == 'true'
        with:
          path: dist
          include-hidden-files: true

      - uses: actions/deploy-pages@v5
        if: steps.commit.outputs.changed == 'true'
        id: deployment
